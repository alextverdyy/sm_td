name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux, Python 3.10, GCC
            os: ubuntu-latest
            python: "3.10"
            cc: gcc
          - name: Linux, Python 3.13, Clang
            os: ubuntu-latest
            python: "3.13"
            cc: clang
          - name: macOS, Python 3.13, Apple Clang
            os: macos-latest
            python: "3.13"
            cc: clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Verify toolchain
        env:
          CC: ${{ matrix.cc }}
        run: |
          python3 --version
          "$CC" --version

      - name: Check Python sources
        run: python3 -m compileall -q tests

      - name: Run unit tests
        env:
          CC: ${{ matrix.cc }}
          SMTD_DEBUG: "0"
        run: python3 tests/run_tests.py
